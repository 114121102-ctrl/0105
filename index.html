<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人消費紀錄系統 (完整版)</title>
    
    <style>
        body {
            font-family: 'Microsoft JhengHei', 'Arial', sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            padding-top: 50px;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 600px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        /* 輸入區塊樣式 */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }

        input, select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #4CAF50;
        }

        button {
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #218838;
        }

        /* 統計區塊 */
        .summary {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #444;
            padding: 10px;
            border-bottom: 2px solid #eee;
        }

        #totalAmount {
            color: #d9534f;
        }

        /* 表格樣式 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background-color: #e9ecef;
            color: #555;
            font-weight: bold;
        }

        /* 類別標籤樣式 */
        .tag {
            background-color: #e2e6ea;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 13px;
            color: #495057;
            font-weight: bold;
        }

        /* 刪除按鈕樣式 */
        .delete-btn {
            background-color: #dc3545;
            padding: 6px 12px;
            font-size: 14px;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>💰 個人消費紀錄</h2>
        
        <div class="input-group">
            <select id="categoryInput">
                <option value="飲食">🍔 飲食</option>
                <option value="交通">🚗 交通</option>
                <option value="娛樂">🎮 娛樂</option>
                <option value="購物">🛍️ 購物</option>
                <option value="居家">🏠 居家</option>
                <option value="其他">🔹 其他</option>
            </select>
            
            <input type="text" id="itemInput" placeholder="消費物品名稱 (如: 午餐)">
            <input type="number" id="priceInput" placeholder="金額 (NT$)" min="0">
            <input type="date" id="dateInput">
            
            <button onclick="addRecord()">＋ 新增紀錄</button>
        </div>

        <div class="summary">
            總消費金額: <span id="totalAmount">0</span> 元
        </div>

        <table>
            <thead>
                <tr>
                    <th width="20%">日期</th>
                    <th width="15%">類別</th>
                    <th width="35%">物品</th>
                    <th width="15%">價格</th>
                    <th width="15%">操作</th>
                </tr>
            </thead>
            <tbody id="recordList">
                </tbody>
        </table>
    </div>

    <script>
        // --- 初始化資料庫 ---
        // 從 LocalStorage 讀取舊資料，如果沒有則使用空陣列
        let expenseDatabase = JSON.parse(localStorage.getItem('expenseData')) || [];

        // 設定日期預設值為今天
        document.getElementById('dateInput').valueAsDate = new Date();

        // 初始渲染
        renderTable();

        // --- 功能: 新增紀錄 ---
        function addRecord() {
            const categoryInput = document.getElementById('categoryInput');
            const itemInput = document.getElementById('itemInput');
            const priceInput = document.getElementById('priceInput');
            const dateInput = document.getElementById('dateInput');

            const categoryValue = categoryInput.value;
            const itemValue = itemInput.value;
            const priceValue = Number(priceInput.value);
            const dateValue = dateInput.value;

            // 驗證輸入
            if (itemValue.trim() === '' || priceValue <= 0 || dateValue === '') {
                alert("請輸入完整的物品名稱、正確金額與日期！");
                return;
            }

            // 建立物件
            const newRecord = {
                id: Date.now(), // 唯一 ID
                category: categoryValue,
                item: itemValue,
                price: priceValue,
                date: dateValue
            };

            // 存入陣列
            expenseDatabase.push(newRecord);
            
            // 存檔並更新畫面
            saveData();
            renderTable();

            // 清空輸入框 (日期保留)
            itemInput.value = '';
            priceInput.value = '';
        }

        // --- 功能: 刪除紀錄 ---
        function deleteRecord(id) {
            if(confirm("確定要刪除這筆紀錄嗎？")) {
                expenseDatabase = expenseDatabase.filter(record => record.id !== id);
                saveData();
                renderTable();
            }
        }

        // --- 功能: 儲存至 LocalStorage ---
        function saveData() {
            localStorage.setItem('expenseData', JSON.stringify(expenseDatabase));
        }

        // --- 功能: 渲染表格 ---
        function renderTable() {
            const listBody = document.getElementById('recordList');
            const totalSpan = document.getElementById('totalAmount');
            
            listBody.innerHTML = '';
            let total = 0;

            // 根據日期排序 (新的在上面)
            // 如果你不想要排序，可以把 .sort(...) 這一段拿掉
            const sortedData = expenseDatabase.sort((a, b) => new Date(b.date) - new Date(a.date));

            sortedData.forEach(record => {
                total += record.price;
                const row = document.createElement('tr');
                
                // 處理舊資料可能沒有 category 的情況
                const categoryDisplay = record.category || '未分類';

                row.innerHTML = `
                    <td>${record.date}</td>
                    <td><span class="tag">${categoryDisplay}</span></td>
                    <td>${record.item}</td>
                    <td>$${record.price}</td>
                    <td>
                        <button class="delete-btn" onclick="deleteRecord(${record.id})">刪除</button>
                    </td>
                `;
                listBody.appendChild(row);
            });

            // 加入千分位符號 (例如 1,000)
            totalSpan.textContent = total.toLocaleString();
        }
    </script>

</body>
</html>
